name: Local Self-Hosted Auto-Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: # Allows manual trigger from GitHub UI anytime

jobs:
  deploy-to-local:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      - name: Deploy Local Server
        run: |
          PORT=4173
          PID=$(lsof -ti :$PORT || true)
          if [ -n "$PID" ]; then
            kill -9 $PID
          fi

          # Tells GitHub Actions runner NOT to kill this background process when step ends
          export RUNNER_TRACKING_ID=""
          nohup python3 -m http.server $PORT --directory dist > /tmp/java-journey-server.log 2>&1 &
          sleep 2

          echo "Deployed successfully on local machine at http://localhost:$PORT"
